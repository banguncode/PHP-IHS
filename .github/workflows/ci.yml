name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.5', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - run: composer update --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/phpunit

  quality:
    name: Compatibility and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer validate --strict --no-check-lock

      - name: Install PHP_CodeSniffer and PHPCompatibility
        run: |
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress -W squizlabs/php_codesniffer "phpcompatibility/php-compatibility:^10.0@dev" dealerdirect/phpcodesniffer-composer-installer

      - run: vendor/bin/phpcs

      - run: php tools/check-style.php

